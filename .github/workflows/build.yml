# =============================================================================
# build.yml — CI build matrix for on-screen-notes.
# =============================================================================
# Fires on every push to any branch and every pull request targeting `main`.
# Each matrix job:
#   1. checks out the repo
#   2. installs the stable Rust toolchain (cached across runs)
#   3. on Ubuntu, apt-installs the X11 / Wayland / GTK dev libs that eframe
#      + xcap link against (Windows and macOS need nothing extra)
#   4. runs `cargo build --release`
#   5. uploads the release binary as a downloadable workflow artifact
#
# Artifacts are kept for 90 days and visible in the "Actions" tab of the
# GitHub repo. To grab the latest CI build:
#   GitHub repo → Actions → pick a successful run → scroll to "Artifacts".
#
# Tagged releases (e.g. `v0.2.0`) are handled by `release.yml`, NOT here.
# =============================================================================

name: build

on:
  push:
    branches: ["**"]   # every branch — keeps preview branches building
  pull_request:
    branches: [main]

# Cancel any earlier in-flight run on the same ref so a fast follow-up
# push doesn't queue behind a slow predecessor.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Release builds with `opt-level = "z"` + `lto = "fat"` are slow to
  # link; bump the timeout in cargo to suppress the false-positive
  # "stalled" detection some hosted runners trip on.
  CARGO_NET_RETRY: 3

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one platform breaking shouldn't cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: on-screen-notes
            artifact_zip:  on-screen-notes-linux-x86_64
          - os: windows-latest
            artifact_name: on-screen-notes.exe
            artifact_zip:  on-screen-notes-windows-x86_64
          - os: macos-latest
            artifact_name: on-screen-notes
            artifact_zip:  on-screen-notes-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # Cache `~/.cargo/registry`, `~/.cargo/git`, and `target/`. First
      # CI run cold-compiles every dep (~3 min); subsequent runs skip
      # them entirely and finish in ~30 s.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Linux build deps — eframe (wgpu, winit, xkbcommon) + xcap
      # (screenshot) link against these.
      - name: Install Linux dev libs
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libxdo-dev \
            libgtk-3-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinerama0-dev \
            libxcb-cursor-dev libssl-dev pkg-config

      - name: cargo build --release
        run: cargo build --release --locked

      # Stage the artifact: binary + bundled sample hotkeys.toml so the
      # download is immediately usable. Sample is generated by the app
      # on first launch but shipping a template gives users something
      # to grep before running.
      - name: Stage artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/release/${{ matrix.artifact_name }} staging/
          cp README.md staging/
          chmod +x staging/${{ matrix.artifact_name }}

      - name: Stage artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/release/${{ matrix.artifact_name }}" staging/
          Copy-Item README.md staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_zip }}
          path: staging/
          retention-days: 90
          if-no-files-found: error

# =============================================================================
# release.yml — tagged-release pipeline.
# =============================================================================
# Fires on every annotated tag matching `v*` (e.g. `v0.2.0`).
# Each matrix job:
#   1. checks out the repo at the tagged commit
#   2. installs Rust + system libs (same as build.yml)
#   3. runs `cargo build --release`
#   4. zips the binary + README + sample hotkeys.toml
#   5. uploads the zip as a release asset
#
# Cutting a release:
#   git tag v0.2.0
#   git push --tags
#
# Result: a public GitHub Release with three zip downloads — one per OS.
# Users grab the zip, extract anywhere, run the binary. Portable, no
# installer, no admin rights. `hotkeys.toml` auto-writes next to the
# binary on first launch.
# =============================================================================

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required by softprops/action-gh-release to publish

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: on-screen-notes
            zip_name:      on-screen-notes-linux-x86_64.zip
          - os: windows-latest
            artifact_name: on-screen-notes.exe
            zip_name:      on-screen-notes-windows-x86_64.zip
          - os: macos-latest
            artifact_name: on-screen-notes
            zip_name:      on-screen-notes-macos-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dev libs
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libxdo-dev \
            libgtk-3-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinerama0-dev \
            libxcb-cursor-dev libssl-dev pkg-config

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Stage payload (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p payload
          cp target/release/${{ matrix.artifact_name }} payload/
          cp README.md payload/
          chmod +x payload/${{ matrix.artifact_name }}

      - name: Stage payload (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payload | Out-Null
          Copy-Item "target/release/${{ matrix.artifact_name }}" payload/
          Copy-Item README.md payload/

      - name: Zip payload (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd payload && zip -r9 "../${{ matrix.zip_name }}" .

      - name: Zip payload (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path payload/* -DestinationPath "${{ matrix.zip_name }}" -Force

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          # Draft on first asset upload; subsequent matrix jobs append.
          # Tag/name are inferred from the `v*` push that triggered us.
          draft: false
          generate_release_notes: true
          files: ${{ matrix.zip_name }}
